<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene player self-test</title>
<style>body{margin:0;background:#111;color:#ddd;font:14px system-ui}#host{width:960px}#out{padding:12px;white-space:pre-wrap}</style>
</head>
<body>
<div id="host"></div>
<div id="out">Running…</div>
<script src="../dist/scene-player.iife.js" data-auto-mount="false"></script>
<script>
/*
 * Determinism self-test: every frame must be a pure function of time. Builds a scene with every preset
 * (an entrance and an exit each, plus a group), plays it frame by frame recording what every element
 * looks like, then jumps to the same frames in a random order through a detour and compares.
 * Open in a browser (after building the player) or run scripts/selftest.mjs. window.selfTestResult
 * holds { ok, frames, mismatches }.
 */
(function () {
  const S = window.UnysonPlusScene;
  // 20 fps puts every clip boundary in this scene (starts at 0.1 + 0.25 n, lengths in 0.05 s steps) exactly
  // on a frame, so the frames where a clip starts or ends are tested: the ones seeking gets wrong.
  const FPS = 20;
  const TALL = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="800"><rect width="100" height="800" fill="#4c9"/><rect y="400" width="100" height="400" fill="#295"/></svg>');
  const layers = [];
  let t = 0.1;
  S.PRESET_CATALOG.forEach((p, i) => {
    const text = p.appliesTo.includes('text') && !p.appliesTo.includes('shape');
    const hasDir = p.fields.some((f) => f.key === 'direction');
    const clips = [{ id: 'a' + i, preset: p.id, start: t, duration: p.defaultDuration }];
    if (hasDir) clips.push({ id: 'b' + i, preset: p.id, start: t + p.defaultDuration + 0.4, duration: 0.5, params: { direction: 'out' } });
    const box = { x: 10 + (i % 5) * 20, y: 12 + Math.floor(i / 5) * 18, w: 16, h: text ? undefined : 10, anchor: 'center' };
    // Image-only presets get a tall picture (a scroll needs something to scroll).
    const imageOnly = p.appliesTo.length === 1 && p.appliesTo[0] === 'image';
    layers.push(text
      ? { id: 'l' + i, type: 'text', text: 'Moving words ' + i, style: { fontSize: 2 }, box, clips }
      : imageOnly
        ? { id: 'l' + i, type: 'image', src: TALL, box, clips }
        : { id: 'l' + i, type: 'shape', shape: 'rect', fill: '#4c9', box, clips });
    t += 0.25;
  });
  // Scroll's endless mode (a repeating picture moved by whole picture lengths).
  layers.push({ id: 'rep', type: 'image', src: TALL, box: { x: 50, y: 80, w: 10, h: 10, anchor: 'center' }, clips: [{ id: 'rp', preset: 'scroll', start: 0.6, duration: 2.5, ease: 'none', params: { from: 0, to: 150, repeat: true } }] });
  // Change text chained three times (each swap starts from what the one before left), one overlapping the next.
  layers.push({ id: 'swap', type: 'text', text: '1 / 10', style: { fontSize: 2 }, box: { x: 30, y: 88, anchor: 'center' }, clips: [
    { id: 'sw1', preset: 'text-swap', start: 0.5, duration: 0.5, params: { to: '2 / 10', style: 'roll' } },
    { id: 'sw2', preset: 'text-swap', start: 1.25, duration: 0.5, params: { to: '3 / 10', style: 'blur' } },
    { id: 'sw3', preset: 'text-swap', start: 1.6, duration: 0.6, params: { to: 'done', style: 'slide' } },
  ] });
  // A select box over two words, after an entrance on the same layer.
  layers.push({ id: 'sel', type: 'text', text: 'The main method', style: { fontSize: 2 }, box: { x: 70, y: 88, anchor: 'center' }, clips: [
    { id: 'sr', preset: 'text-rise', start: 0.1, duration: 0.6 },
    { id: 'sb', preset: 'select-box', start: 0.85, duration: 0.6, params: { word: 2, words: 2, color: '#f59e0b' } },
  ] });
  // A dashed outline: marching, then made solid; a typed line with a caret; a clock counting; a whip with a streak.
  layers.push({ id: 'dash', type: 'shape', shape: 'rect', fill: 'transparent', stroke: '#4c9', strokeWidth: 0.2, dash: 1, radius: 1, box: { x: 15, y: 70, w: 10, h: 6 }, clips: [
    { id: 'dm', preset: 'march', start: 0.2, duration: 1.5 }, { id: 'ds', preset: 'dash-solid', start: 1.8, duration: 0.5 },
  ] });
  layers.push({ id: 'typ', type: 'text', text: 'make a hero', style: { fontSize: 2 }, box: { x: 50, y: 70, anchor: 'left' }, clips: [
    { id: 'ty', preset: 'text-typewriter', start: 0.3, duration: 1, params: { caret: true } },
  ] });
  layers.push({ id: 'clk', type: 'text', text: '0:45', style: { fontSize: 2 }, box: { x: 85, y: 70 }, clips: [
    { id: 'ck', preset: 'text-count', start: 0.2, duration: 1.2 },
  ] });
  layers.push({ id: 'wo', type: 'group', start: 0, clips: [{ id: 'wo1', preset: 'tr-whip', start: 2.1, duration: 0.5, params: { direction: 'out', streak: true } }], layers: [
    { id: 'wo2', type: 'text', text: 'Leaving', style: { fontSize: 2 }, box: { x: 30, y: 60 }, clips: [] } ] });
  layers.push({ id: 'wi', type: 'group', start: 0, clips: [{ id: 'wi1', preset: 'tr-whip', start: 2.1, duration: 0.5, params: { direction: 'in', streak: true } }], layers: [
    { id: 'wi2', type: 'text', text: 'Arriving', style: { fontSize: 2 }, box: { x: 30, y: 64 }, clips: [] } ] });
  // A line drawn on with a comet riding it; flow lines between two layers (one moving) with an icon riding one;
  // a diagram whose nodes pop in, move and carry a travelling tag.
  layers.push({ id: 'ln', type: 'path', d: 'M 0 80 C 25 0, 60 100, 100 20', stroke: '#7cc4ff', strokeWidth: 0.25, arrow: 'end', glow: 0.5, dash: 0.8, box: { x: 20, y: 50, w: 20, h: 12 }, clips: [{ id: 'lnd', preset: 'draw', start: 0.4, duration: 1 }] });
  layers.push({ id: 'cm', type: 'shape', shape: 'ellipse', fill: '#fff', box: { x: 0, y: 0, w: 1, ratio: 1 }, clips: [{ id: 'cmf', preset: 'follow-path', start: 1.5, duration: 1, params: { path: 'ln', trail: 0.3, rotate: true } }] });
  layers.push({ id: 'fa', type: 'shape', shape: 'rect', fill: '#234', box: { x: 50, y: 50, w: 6, h: 8 }, clips: [] });
  layers.push({ id: 'fb', type: 'shape', shape: 'rect', fill: '#234', box: { x: 75, y: 55, w: 6, h: 8 }, clips: [{ id: 'fbk', preset: 'keyframes', start: 0.5, duration: 2, params: { frames: [{ t: 0, y: 0 }, { t: 2, y: -60 }] } }] });
  layers.push({ id: 'fl', type: 'flow', from: 'fa', to: 'fb', count: 5, pulses: 2, clips: [{ id: 'fld', preset: 'draw', start: 0.3, duration: 0.8 }] });
  layers.push({ id: 'fi', type: 'shape', shape: 'rect', fill: '#f90', box: { x: 0, y: 0, w: 1, ratio: 1 }, clips: [{ id: 'fif', preset: 'follow-path', start: 1.2, duration: 1.2, params: { path: 'fl', line: 2 } }] });
  layers.push({ id: 'dg', type: 'diagram', box: { x: 50, y: 30, w: 30, h: 15 }, nodes: [
    { id: 'n1', x: 10, y: 50, label: 'Input' }, { id: 'n2', x: 50, y: 50, label: 'Store', at: 0.6, moves: [{ t: 2, x: 50, y: 20 }] },
    { id: 'n3', x: 90, y: 50, shape: 'value', label: 'name', sub: 'John', at: 1.1 }, { id: 'n4', x: 50, y: 90, shape: 'dot', label: 'a1f', at: 1.4 } ],
    edges: [{ from: 'n1', to: 'n2' }, { from: 'n2', to: 'n3', kind: 'step', label: 'save', dashed: true }, { from: 'n2', to: 'n4', kind: 'straight' }],
    tag: { label: 'HEAD', stops: [{ node: 'n1', t: 0.5 }, { node: 'n2', t: 1.2 }, { node: 'n3', t: 2.1 }] }, clips: [] });
  // A code layer: typed, highlighted, noted, changed (lines inserted and replaced), then run.
  layers.push({ id: 'code', type: 'code', title: 'main.py', run: true, code: `name = input()
print(name)
print(name)`, box: { x: 80, y: 30, w: 30, h: 30 }, clips: [
    { id: 'ct', preset: 'code-type', start: 0.2, duration: 1.2, params: { suggest: true } },
    { id: 'ch', preset: 'code-highlight', start: 1.5, duration: 0.3, params: { line: 1, token: 'name' } },
    { id: 'cn', preset: 'code-note', start: 1.5, duration: 0.3, params: { line: 2, text: 'shows it' } },
    { id: 'ce', preset: 'code-edit', start: 2, duration: 1.5, params: { to: `def hi(n):
    print(n)

name = input()
hi(name)` } },
    { id: 'cr', preset: 'code-run', start: 3.6, duration: 0.6, params: { output: `John
John` } },
  ] });
  // A repeat (three staggered copies of a two-layer row), a morph between two shapes, captions from voice words.
  layers.push({ id: 'rp', type: 'repeat', items: [{ t: 'one' }, { t: 'two' }, { t: 'three' }], step: { y: 4 }, stagger: 0.2, item: { id: 'row', type: 'group', clips: [], layers: [
    { id: 'rb', type: 'shape', shape: 'rect', fill: '#345', box: { x: 10, y: 60, w: 8, h: 3 }, clips: [{ id: 'rbi', preset: 'stack-in', start: 0.3, duration: 0.4 }] },
    { id: 'rt', type: 'text', text: 'Row {{t}}', style: { fontSize: 1 }, box: { x: 10, y: 60 }, clips: [{ id: 'rti', preset: 'fade', start: 0.4, duration: 0.3 }] } ] }, clips: [] });
  layers.push({ id: 'ma', type: 'shape', shape: 'rect', fill: '#3b82f6', radius: 1, box: { x: 30, y: 75, w: 5, h: 5 }, clips: [{ id: 'mm', preset: 'morph', start: 1, duration: 0.8, params: { to: 'mb' } }] });
  layers.push({ id: 'mb', type: 'shape', shape: 'ellipse', fill: '#f59e0b', box: { x: 40, y: 85, w: 8, h: 6 }, clips: [] });
  layers.push({ id: 'rx', type: 'text', text: 'React', style: { fontSize: 1.5 }, box: { x: 80, y: 95 }, clips: [{ id: 'rxg', preset: 'react', start: 0.5, duration: 2, params: { effect: 'glow' } }, { id: 'rxs', preset: 'react', start: 2.6, duration: 1, params: { effect: 'scale', source: 'bass' } }] });
  // Parallax: a near and a far layer move differently with the camera.
  layers.push({ id: 'near', type: 'shape', shape: 'rect', fill: '#a5f', depth: 0.5, box: { x: 90, y: 60, w: 3, h: 3 }, clips: [] });
  layers.push({ id: 'far', type: 'shape', shape: 'rect', fill: '#5af', depth: -0.4, box: { x: 94, y: 60, w: 3, h: 3 }, clips: [] });
  layers.push({ id: 'cap', type: 'captions', style: { fontSize: 1.5 }, box: { x: 60, y: 95 }, clips: [] });
  // A layer pinned to the stage (placed in the stage-wide pin space, outside the camera).
  layers.push({ id: 'pin', type: 'text', text: 'Pinned', pin: 'stage', style: { fontSize: 2 }, box: { x: 100, y: 100, anchor: 'bottom-right' }, clips: [{ id: 'pf', preset: 'fade', start: 0.35, duration: 0.6 }] });
  layers.push({ id: 'g', type: 'group', start: 1, clips: [{ id: 'gf', preset: 'slide', start: 0.2, duration: 0.6 }], layers: [
    { id: 'g1', type: 'text', text: 'In a group', style: { fontSize: 3 }, box: { x: 50, y: 92 }, clips: [{ id: 'c', preset: 'text-rise', start: 0.5, duration: 0.8 }] },
  ] });
  const scene = { format: 'unysonplus-scene', version: 1, duration: Math.ceil(t + 2), stage: { breakpoints: [{ id: 'd', minWidth: 0, aspect: [16, 9] }], heightMode: 'ratio' }, playback: { trigger: 'manual', loop: false }, layers,
    // A voice-over's words, for the captions.
    audio: [{ id: 'vo', src: 'sfx:pop', start: 0.2, role: 'voice', words: 'One two three. Four five six seven eight nine.'.split(' ').map((w, i) => ({ w, t: 0.1 + i * 0.3, d: 0.25 })) },
      // Music with a loudness curve, for React to music.
      { id: 'mu', src: 'sfx:shimmer', start: 0, role: 'music', envelope: { fps: 20, loud: Array.from({ length: 400 }, (_, i) => Math.round((0.5 + 0.5 * Math.sin(i / 3)) * 100) / 100), bass: Array.from({ length: 400 }, (_, i) => (i % 10) / 10) } }],
    // A camera, so its moves are checked for seeking too.
    camera: { keys: [{ id: 'k1', t: 0.5, zoom: 1, x: 0, tiltX: 0 }, { id: 'k2', t: 2, zoom: 1.3, x: 10, ease: 'softInOut' }, { id: 'k3', t: 4, zoom: 1, x: 0, tiltX: 15, roll: 4 }] } };

  const player = S.mount(document.getElementById('host'), scene, { autoplay: false, editor: true, allowCode: true });
  const els = () => Array.from(document.querySelectorAll('.upw-stage *'));
  const snap = () => els().map((el) => {
    const c = getComputedStyle(el);
    // "none" and the identity matrix draw the same; GSAP leaves the second behind once it has touched an element.
    const tf = c.transform === 'matrix(1, 0, 0, 1, 0, 0)' ? 'none' : c.transform;
    return [tf, c.opacity, c.filter, c.clipPath, c.visibility, c.letterSpacing, c.color, c.backgroundColor, c.objectPosition, c.backgroundPosition, c.strokeDashoffset, c.strokeDasharray, c.textShadow, c.translate === '0px' ? 'none' : c.translate, el.classList && el.classList.contains('upw-progress') ? c.width : '', el.getAttribute ? (el.getAttribute('d') || el.getAttribute('points') || '') + (el.style ? el.style.left + el.style.top + (el.style.translate === 'none' ? '' : el.style.translate) : '') : '', el.children.length ? '' : el.textContent].join('|');
  }).join('\n');

  // A fixed pseudo-random order, so a failure is reproducible.
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

  const total = Math.round(scene.duration * FPS);
  const want = new Set();
  // Every frame where a clip (or a camera key) starts or ends, and the frames either side of it.
  const edges = [];
  const walk = (list, offset) => list.forEach((l) => {
    l.clips.forEach((c) => { edges.push(offset + c.start, offset + c.start + c.duration); });
    if (l.layers) walk(l.layers, offset + (l.start || 0));
  });
  walk(scene.layers, 0);
  (scene.camera ? scene.camera.keys : []).forEach((k) => edges.push(k.t));
  edges.forEach((t) => { const f = Math.round(t * FPS); [f - 1, f, f + 1].forEach((x) => { if (x >= 0 && x <= total) want.add(x); }); });
  const boundaryFrames = want.size;
  while (want.size < boundaryFrames + 24) want.add(Math.floor(rnd() * total));
  const recorded = new Map();
  for (let f = 0; f <= total; f++) {
    player.seek(f / FPS);
    if (want.has(f)) recorded.set(f, snap());
  }
  const mismatches = [];
  for (const f of [...want].sort(() => rnd() - 0.5)) {
    player.seek(rnd() * scene.duration); // detour
    player.seek(f / FPS);
    const now = snap();
    if (now !== recorded.get(f)) {
      const a = recorded.get(f).split('\n');
      const b = now.split('\n');
      const i = a.findIndex((x, k) => x !== b[k]);
      mismatches.push({ frame: f, time: +(f / FPS).toFixed(3), element: i, played: a[i], jumped: b[i] });
    }
  }
  window.selfTestResult = { ok: mismatches.length === 0, frames: want.size, presets: S.PRESET_CATALOG.length, mismatches };
  document.getElementById('out').textContent = (mismatches.length ? 'FAIL' : 'PASS') + ': ' + want.size + ' frames, ' + S.PRESET_CATALOG.length + ' presets\n' + JSON.stringify(mismatches, null, 2);
})();
</script>
</body>
</html>
